name: Daily Agentic AI News Report

on:
  schedule:
    # Every day at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Generate daily news report
        run: agentic-news --verbose --print-report

      - name: Commit and push report
        run: |
          git config user.name "Agentic AI News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/*.md reports/*.json docs/
          if git diff --staged --quiet; then
            echo "No new report or website changes to commit."
          else
            git commit -m "chore: add daily agentic AI news report and website $(date -u +%Y-%m-%d)"
            git push
          fi
