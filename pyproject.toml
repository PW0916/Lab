[project]
name = "agentic-news-agent"
version = "1.0.0"
description = "Daily news agent for agentic AI developments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "requests>=2.31.0",
    "python-dateutil>=2.9.0",
    "ddgs>=9.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
agentic-news = "agentic_news_agent.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
