# before any workflow, agent or skill is generated. Every rule cites its source.
# Rule types:
#   HARD      — deterministic; the platform applies it and shows the calculation
#   JUDGEMENT — a named human decides; the platform prepares the facts
#   ADVISORY  — tacit or planning guidance; surfaced, never blocking, until the owner promotes it
#   DERIVED   — an interpretation the Studio made to reconcile documents; must be confirmed

