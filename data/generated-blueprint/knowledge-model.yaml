findings:   # inconsistencies, gaps and ambiguities the Studio surfaced for the process owner
  - id: F-01
    severity: HIGH
    title: "Band B upper limit differs"
    detail: "SOP v1.4 retains a v1.3 implementation note stating Band B is HK$50,001–150,000; DoA v3.2 (15 Aug 2026) sets HK$200,000."
    resolution: "Apply DoA v3.2 (Level 1 governs). Log SOP revision."
    status: RESOLVED_BY_HIERARCHY
  - id: F-02
    severity: HIGH
    title: "Flash cut-off differs"
    detail: "SOP §5.2 says 5 working days; Calendar v2.0 §2 says 3 working days and notes the SOP is pending update; Minutes item 4 confirm 3."
    resolution: "Hierarchy would favour the SOP; the process owner decided in Studio to apply 3 working days and log the SOP revision (feedback item 4)."
    status: RESOLVED_BY_OWNER
  - id: F-03
    severity: MEDIUM
    title: "Inputs missing from SOP"
    detail: "Checklist §2.4/§2.6 and Minutes item 4 require price zone and event code; SOP §4 does not list them; requests were returned in C20 for this."
    resolution: "Add both to intake (price zone derived from scope; event code asked for Event type or when the cycle carries an event)."
    status: APPLIED
  - id: F-04
    severity: MEDIUM
    title: "'Effective unit cost' terminology"
    detail: "SOP §6.1 and Margin Policy use different phrasing for cost net of off-invoice."
    resolution: "Use Margin Policy §2/§4 definition (D-03)."
    status: APPLIED
  - id: F-05
    severity: MEDIUM
    title: "Tacit rule — own-brand <40% visibility"
    detail: "Minutes item 1 decision is not in any controlled document."
    resolution: "'Encoded as advisory A-01 with 'informed' routing to Head of Trading; owner to confirm with Rachel Tsang and add to SOP.'"
    status: PENDING_CONFIRMATION
  - id: F-06
    severity: LOW
    title: "Tacit rule — skincare hero SKUs in C23"
    detail: "Minutes item 2 planning guideline."
    resolution: "Advisory A-02, prompt only."
    status: APPLIED
  - id: F-07
    severity: MEDIUM
    title: "'Hero SKU' undefined"
    detail: "SOP §2 defers to a Trading list; DoA §5.7 depends on it."
    resolution: "Product Master strategicFlag = HERO (D-01), per Minutes item 2."
    status: APPLIED
  - id: F-08
    severity: MEDIUM
    title: "Reference price basis"
    detail: "'GDL §5 refers to the price 'actually charged'; ERP regular price history does not deduct promotional periods.'"
    resolution: "Implement on ERP regular price history (D-05); ask Compliance whether promotional weeks should be excluded."
    status: OPEN_QUESTION
  - id: F-09
    severity: LOW
    title: "System alias"
    detail: "'PromoHub' is a team nickname for the Promotion Management System."
    resolution: "Glossary entry D-02."
    status: APPLIED
  - id: F-10
    severity: LOW
    title: "Plausibility check scope"
    detail: "Margin Policy §10 excludes multi-buy, GWP, points and coupon mechanics from the forecast check."
    resolution: "'Report 'not checked (policy scope)' for those mechanics rather than silently skipping.'"
    status: APPLIED
  - id: F-11
    severity: LOW
    title: "Overlapping depth rules for BF26"
    detail: "DoA §5.7 (hero depth >35% → Band B) and Calendar §5 BF26 (depth up to 40% by exception for non-hero) overlap and use different thresholds."
    resolution: "Apply DoA; treat Calendar event rule as advisory A-04; owner to align."
    status: PENDING_CONFIRMATION
  - id: F-12
    severity: LOW
    title: "Form validation gaps"
    detail: "'Form §'Known limitations' lists free-text scope codes, no conflict check, no plausibility check, no status visibility.'"
    resolution: "All four are covered by the generated workflow (Store Network validation, PromoHub conflict search, J-05, status queries)."
    status: APPLIED

glossary:
  - { term: "Promotion cycle", definition: "Two-week trading period starting Thursday (C20–C28 in this calendar)", source: "SOP §2; CAL" }
  - { term: "Cut-off", definition: "Date by which a request must be approved for an execution route", source: "SOP §5.2; CAL §2" }
  - { term: "Net promotion investment", definition: "(regular − promo − recognised funding per unit) × forecast, floor 0, aggregated per campaign", source: "DOA §3" }
  - { term: "Effective unit cost", definition: "Landed cost less confirmed off-invoice covering the period", source: "MP §2" }
  - { term: "Recognised funding per unit", definition: "CONFIRMED scan-back or lump-sum funding covering item/period/channels, prorated to cap", source: "MP §5" }
  - { term: "Band", definition: "Approval level A–D determined by investment and escalation conditions", source: "DOA §4–5" }
  - { term: "Hero SKU", definition: "Product Master strategicFlag = HERO", source: "MIN item 2" }
  - { term: "PromoHub", definition: "Promotion Management System", source: "INTAKE §5" }
  - { term: "Special Price", definition: "Non-comparative price messaging used when the reference price rule is not met", source: "GDL §5.2" }
  - { term: "Parallel gate", definition: "Compliance or Supply Chain confirmation that must close before release but does not change the approver", source: "DOA §5.9–5.10" }
