  # =====================================================================
  - version: "1.0"
    status: APPROVED_BY_PROCESS_OWNER
    approvedOn: 2026-09-26
    approvedBy: "Mei Wong, Head of Trade Marketing (E10105)"
    summary: "Fourteen stages. Progressive intake (item and intent first, offer details after the regulatory screen); economics and supply split; Pricing Ops feasibility pre-check added; advisory A-01 wired to informed routing; Flash cut-off resolved to 3 working days."
    feedbackApplied:
      - { item: 1, from: "Mei Wong", request: "Do not make people fill in forecast and funding for an item that turns out to be prohibited — screen the item first.", decision: ACCEPTED, effect: "S01 split into S01 (item and intent) and S04 (offer details); S02–S03 run between them." }
      - { item: 2, from: "Mei Wong", request: "Pricing Ops does a feasibility check before approval today — it is in the Checklist §2 but missing from the draft.", decision: ACCEPTED, effect: "New stage S10 Setup feasibility owned by Setup Readiness; Checklist §2 checks moved before routing." }
      - { item: 3, from: "Mei Wong", request: "Rachel asked to see any own-brand promotion under 40% margin — add that.", decision: ACCEPTED_AS_ADVISORY, effect: "A-01 wired to informed routing (Head of Trading FYI). Not a band change. Recorded as pending Rachel Tsang confirmation because it is not in a controlled document (F-05)." }
      - { item: 4, from: "Mei Wong", request: "Flash cut-off is 3 working days now, not 5.", decision: ACCEPTED_WITH_RECORD, effect: "H-07 applies Calendar v2.0 (3 WD). Deviation from SOP §5.2 recorded; SOP revision action logged for Mei (F-02)." }
      - { item: 5, from: "Mei Wong", request: "Skip the Finance review for Band B under HK$100k to speed things up.", decision: REJECTED_BY_CONSISTENCY_CHECK, effect: "Contradicts DoA v3.2 §4 (Finance review for all Band B). Studio will not encode a rule that overrides a Level 1 policy; a change request note to Andrew Kwok (policy owner) was generated instead." }
      - { item: 6, from: "Mei Wong", request: "Call them Promotion Owners, not Requesters.", decision: ACCEPTED, effect: "UI copy and decision pack labels changed; role identifier REQUESTER unchanged in rules." }
      - { item: 7, from: "Mei Wong", request: "Finance owns economics, Supply Chain owns stock — separate them.", decision: ACCEPTED, effect: "S07 split into S08 Promotion economics and S09 Supply readiness with separate owners and outputs." }
    stages:
      - id: S01
        name: "Intake — item and intent"
        owner: Intake Concierge
        rules: [H-04]
        collects: [requester (from identity), item code(s) or description, mechanic, promotion type, intended cycle or dates, channels, store scope, leaflet yes/no]
        humanTouch: "Conversational; the assistant looks up the item as soon as it is named and confirms it back"
        outputs: [case created PR-YYYY-NNNN, status INTAKE]
      - id: S02
        name: "Item and commercial data"
        owner: Commercial Data
        rules: [H-01, D-01, D-02, D-03, H-28]
        systems: [Product Master, ERP Pricing & Cost, Sales & Stock Insights, Store Network]
        outputs: [item facts with sources and timestamps, regular price and history, effective unit cost, baseline, stock position, scope validation]
        pauseOn: ["data unavailable (H-28) → status WAITING_DATA"]
      - id: S03
        name: "Regulatory screen"
        owner: Compliance
        rules: [H-02, H-03, D-04, J-06]
        systems: [Compliance Register]
        stopOn: BLOCKED_REGULATORY
        outputs: [screen result, gate required yes/no, alternatives if blocked]
      - id: S04
        name: "Intake — offer details, completeness and cut-off"
        owner: Intake Concierge
        rules: [H-04, H-05, H-06, H-07]
        systems: [PromoHub (cycles, event codes), Store Network]
        collects: [promotional price or offer terms, forecast units, funding declaration, rationale, comparative claim intended, event code if applicable, mechanic-specific inputs]
        outputs: [complete request, cut-off table with days remaining vs expected decision date, options if a cut-off cannot be met]
      - id: S05
        name: "Funding recognition"
        owner: Funding
        rules: [H-08, H-09, H-10, H-11, H-12, H-13]
        systems: [Trade Funding Register, ERP Pricing & Cost]
        humanTouch: "If funding is claimed but not CONFIRMED: upload evidence now, or proceed with zero"
        outputs: [recognised funding per unit with reason, coverage, effective unit cost]
      - id: S06
        name: "Calendar conflict and frequency"
        owner: Calendar & Conflict
        rules: [H-14, H-15, A-02]
        systems: [PromoHub, Sales & Stock Insights]
        outputs: [conflicts (blocking / adjacent / none), promotion weeks per channel vs limit, advisories]
      - id: S07
        name: "Reference price and claims"
        owner: Compliance
        rules: [H-26, D-05]
        systems: [ERP Pricing & Cost]
        outputs: [comparative claim permitted yes/no with days at price and last change, Special Price fallback, Compliance wording review if needed]
      - id: S08
        name: "Promotion economics"
        owner: Promotion Economics
        rules: [H-16, H-17, H-18, H-19, H-20, H-21, H-28, J-05, A-01, A-03, A-04]
        systems: [Sales & Stock Insights (benchmarks)]
        outputs: [margin vs floor, depth, duration, investment (aggregated), floor price / min funding if below floor, worst-case multi-buy table, plausibility flag, advisories]
      - id: S09
        name: "Supply readiness"
        owner: Supply Readiness
        rules: [H-27, J-04]
        systems: [Sales & Stock Insights]
        outputs: [cover vs 110% forecast counting inbound ≤ T-3, gate required yes/no, expedite options]
      - id: S10
        name: "Setup feasibility (Pricing Ops pre-check)"
        owner: Setup Readiness
        rules: [H-30]
        systems: [PromoHub, Store Network, Product Master]
        outputs: [Checklist §2 results (item active, barcode, mechanic per channel, price zone, scope, event code, dates, lead time, no duplicate draft)]
      - id: S11
        name: "Approval routing"
        owner: Approval Routing
        rules: [H-22, H-23, H-24, H-25, H-33]
        systems: [Authority Directory]
        outputs: [band, escalation conditions triggered, reviewer / approver / informed / gate owners with delegation references, expected decision date]
      - id: S12
        name: "Decision pack and approvals"
        owner: Decision Pack & Reporter
        rules: [H-29, H-32, J-01, J-02, J-03, J-04]
        systems: [Approval & Notification Hub, Compliance Register]
        parallel:
          - "Finance review (Band B+) → approver decision"
          - "Compliance gate (if opened)"
          - "Supply Chain gate (if opened)"
          - "Cut-off exception (if requested)"
        humanTouch: "Named humans decide in their inbox; the assistant records decision, conditions and delegation reference"
        outputs: [decision pack DP-…, tasks AT-…, decisions, conditions]
      - id: S13
        name: "Post-approval setup (simulated)"
        owner: Setup Readiness
        rules: [H-30, H-31]
        systems: [PromoHub]
        outputs: [draft PD-… labelled SIMULATED, validation result, handover note to Pricing Ops with Checklist §3 timeline]
      - id: S14
        name: "Completion and handover"
        owner: Decision Pack & Reporter
        rules: [H-32]
        systems: [Approval & Notification Hub]
        outputs: [status SETUP_CONFIRMED (simulated), notifications to owner / Category Lead / Pricing Ops, PPE reminder scheduled]

    caseStatuses: [INTAKE, WAITING_DATA, BLOCKED_REGULATORY, MORE_INFO_REQUIRED, CHECKS_COMPLETE, READY_FOR_APPROVAL, AWAITING_FINANCE_REVIEW, AWAITING_APPROVAL, AWAITING_GATES, EXCEPTION_REVIEW, RETURNED_FOR_REVISION, APPROVED, APPROVED_WITH_CONDITIONS, REJECTED, WITHDRAWN, SETUP_DRAFTED, SETUP_CONFIRMED]

    decisionPackTemplate:
      sections:
        - "Case and Promotion Owner"
        - "Promotion terms"
        - "Item facts (source, timestamp)"
        - "Regulatory screen"
        - "Funding recognition and evidence"
        - "Conflicts, frequency, duration"
        - "Reference price and claims"
        - "Economics — inputs, formulas, results (Margin Policy v2.1)"
        - "Supply readiness"
        - "Setup feasibility"
        - "Band, escalations, routing (DoA v3.2), delegation references"
        - "Open gates and conditions"
        - "Advisories"
        - "Recommendation (labelled; rule citations)"
        - "Documents and versions applied; SIMULATED data notice"
